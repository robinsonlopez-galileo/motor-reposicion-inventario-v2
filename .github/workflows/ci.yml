name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas (ruff y pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar el paquete y las herramientas de desarrollo
        run: pip install -e ".[dev]"
      - name: Estilo (ruff)
        run: ruff check .
      - name: Pruebas (pytest, con datos sintéticos)
        run: pytest -v
