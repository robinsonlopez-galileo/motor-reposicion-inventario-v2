# Motor de reposición de inventario · Airflow 3.3.2 con LocalExecutor
#
#   docker compose up -d --build
#
# Antes: copiar los CSV de Kaggle (o el ZIP de la competencia) en datos/kaggle/. No hace falta
# archivo .env: todos los valores tienen un valor por defecto (ver .env.example para cambiarlos).
name: motor-reposicion

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: motor-reposicion-airflow:2.0.0
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_CLAVE:-airflow}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Los DAGs quedan activos al crearse: el periodo se procesa solo, sin intervención manual.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__PARALLELISM: ${AIRFLOW_PARALELISMO:-6}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-motor-reposicion-clave-jwt-local}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    # Periodo de operación (vacío = el de config/operacion.yaml).
    CORTE_HISTORICO: ${CORTE_HISTORICO:-}
    FIN_OPERACION: ${FIN_OPERACION:-}
    MOTOR_POKE_INTERVAL: ${MOTOR_POKE_INTERVAL:-60}
  volumes:
    - ./datos/kaggle:/opt/motor/datos/kaggle:ro
    - motor-datos:/opt/motor/data
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16.9
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_CLAVE:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # Migra la base de Airflow y crea el usuario de la interfaz.
  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USUARIO:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_CLAVE:-airflow}
    restart: "no"

  # Construye la carga histórica y la bandeja a partir de los archivos de Kaggle (una sola vez).
  carga-inicial:
    <<: *airflow-common
    command: ["python", "-m", "motor_reposicion.cli", "carga-inicial"]
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
      carga-inicial:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db:
  airflow-logs:
  motor-datos:
